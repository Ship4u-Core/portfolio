<!-- hero -->
<text x="960" y="510" text-anchor="middle" fill="#fff"
      font-family="Inter,Arial,sans-serif" font-size="52" font-weight="750">
  Welcome to Your Safe
</text>
<text x="960" y="566" text-anchor="middle" fill="#fff"
