<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#303030" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>

<rect width="1920" height="1080" fill="#000"/>

<!-- subtle atmospheric glows -->
<ellipse cx="120" cy="230" rx="170" ry="150" fill="url(#glow)" opacity=".55" filter="url(#soft)"/>
<ellipse cx="1770" cy="270" rx="170" ry="150" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>
<ellipse cx="130" cy="900" rx="170" ry="150" fill="url(#glow)" opacity=".35" filter="url(#soft)"/>

<!-- header -->
<text x="24" y="54" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">HearU</text>
<line x1="0" y1="93" x2="1920" y2="93" stroke="#202020" stroke-width="1"/>

<!-- header buttons -->
<rect x="1690" y="25" width="82" height="45" rx="8" fill="#000" stroke="#193047" stroke-width="1.5"/>
<text x="1731" y="54" text-anchor="middle" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Login</text>
<rect x="1784" y="25" width="100" height="45" rx="8" fill="#000" stroke="#193047" stroke-width="1.5"/>
<text x="1834" y="54" text-anchor="middle" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Sign Up</text>

